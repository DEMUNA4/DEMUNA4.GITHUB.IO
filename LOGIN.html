<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - DEMUNA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            align-items: center;
            padding-top: 40px;
            padding-bottom: 40px;
            background-color: #f8f9fa;
        }
        .form-signin {
            max-width: 420px; /* Hacemos el contenedor un poco más ancho para las letras grandes */
            padding: 15px;
            margin: auto;
        }
        .form-signin .form-floating:focus-within {
            z-index: 2;
        }
        
        /* Ajustes para hacer los textos y cajas más grandes */
        .form-floating > .form-control {
            height: 65px; /* Cajas más altas */
            font-size: 18px; /* Letra más grande dentro de las cajas */
        }
        .form-floating > label {
            font-size: 18px; /* Letra más grande para las etiquetas (Email/Contraseña) */
            padding: 20px 12px;
        }
        .form-signin input[type="email"] {
            margin-bottom: -1px;
            border-bottom-right-radius: 0;
            border-bottom-left-radius: 0;
        }
        .form-signin input[type="password"] {
            margin-bottom: 15px;
            border-top-left-radius: 0;
            border-top-right-radius: 0;
        }
        .checkbox label {
            font-size: 18px; /* Letra más grande para "Recordarme" */
        }
        .btn-lg {
            font-size: 20px; /* Letra más grande para el botón de Ingresar */
            padding: 12px;
        }
        .enlace-volver {
            font-size: 18px; /* Letra más grande para el enlace de regresar */
        }
    </style>
</head>
<body class="text-center">

<main class="form-signin w-100 m-auto">
    <form>
        <img class="mb-4" src="https://www.munitinta.gob.pe/images/logos_varios/demuna.jpg" alt="Logo DEMUNA" width="130" height="auto">
        
        <h1 class="h2 mb-4 fw-bold" style="color: #eb4b07;">Ingresar al Sistema</h1>

        <div class="form-floating">
            <input type="email" class="form-control" id="floatingInput" placeholder="nombre@ejemplo.com" required>
            <label for="floatingInput">Correo electrónico</label>
        </div>
        
        <div class="form-floating">
            <input type="password" class="form-control" id="floatingPassword" placeholder="Contraseña" required>
            <label for="floatingPassword">Contraseña</label>
        </div>

        <div class="checkbox mb-4 text-start">
            <label>
                <input type="checkbox" value="remember-me" style="width: 18px; height: 18px; vertical-align: middle;"> Recordarme
            </label>
        </div>
        
        <button class="w-100 btn btn-lg btn-primary fw-bold" style="background-color: #0066cc; border: none;" type="submit">Iniciar sesión</button>
        
        <div class="mt-4">
            <a href="TRABAJO FINAL.html" class="text-decoration-none fw-bold enlace-volver" style="color: #f86700;">← Volver al Inicio</a>
        </div>

        <p class="mt-5 mb-3 text-muted" style="font-size: 16px;">&copy; 2017–2026</p>
    </form>
</main>

</body>
</html>
